name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION gibt es schon, es wird nur gebaut"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$VERSION, Release wird erstellt"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.7.1/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|Could not|FAILURE|Exception" -A4 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BlackyTV-${{ steps.version.outputs.version }}
          path: |
            build/libs/*.jar
            relay/BlackyTVRelay.java

      - name: Release
        if: steps.version.outputs.new == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BlackyTV ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            build/libs/*.jar
            relay/BlackyTVRelay.java
